schema_version: 1

context:
  version: "3.5.1.4"

package:
  name: fastjet
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fastjet/fastjet-${{ version }}.tar.gz
  sha256: 46be9f192ea5f32269794add0c84dfa3e61b6db5d6366d1a01eb712c28492cc0

build:
  number: 1
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation -C"cmake.define.SKHEPFJ_USE_INSTALLED_FASTJET=ON" -C"cmake.define.SKHEPFJ_USE_INSTALLED_FASTJET_CONTRIB=ON" -C"cmake.define.SKHEPFJ_PASSTHRU_FASTJET_SWIG=ON"

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    - if: build_platform != target_platform
      then:
        - cross-python_${{ target_platform }}
        - python
    - cmake
    - if: unix
      then: make
  host:
    - fastjet-cxx  # pick up global pinning
    - fastjet-cxx-python
    - fastjet-contrib
    - pip
    - scikit-build-core
    - setuptools_scm
    - pybind11
    - python
    - if: not (win and arm64)
      then: cgal-cpp
  run:
    - awkward >=2
    - numpy >=1.13.3
    - python
    - vector
    - fastjet-cxx-python
    - fastjet-contrib

tests:
  - package_contents:
      files:
        - if: win
          then: Lib/site-packages/fastjet/_ext.*
          else: lib/python*/site-packages/fastjet/_ext.*
      site_packages:
        - fastjet
        - fastjet._generalevent
        - fastjet._multievent
        - fastjet._pyjet
        - fastjet._singleevent
        - fastjet._swig
        - fastjet._utils
        - fastjet.version
  - python:
      imports:
        - fastjet
      pip_check: true
  - requirements:
      run:
        - pip
        - python
    script:
      - pip list

about:
  summary: Official FastJet bindings to Python and Awkward Array.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/scikit-hep/fastjet

extra:
  recipe-maintainers:
    - kratsg
    - lgray
    - jpivarski
    - chrispap95
    - jmduarte
    - matthewfeickert
